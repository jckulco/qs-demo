<svg width="680" height="660" viewBox="0 0 680 660" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Overview of the nine DataStage jobs built for this demo</title>
<desc>A flowchart showing the CRM deduplication track (investigate and standardize, match frequency plus one-source match, survive, master merge) converging with a parallel ERP standardize step into a shared match frequency stage, then a two-source match, ending in a final result box.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#993C1D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<style>
  text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
</style>

<rect x="195" y="40" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="325" y="58" text-anchor="middle" dominant-baseline="central" fill="#444441">Investigate &amp; standardize</text>
<text class="ts" x="325" y="78" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Profile and clean the CRM</text>

<line x1="325" y1="96" x2="325" y2="126" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="195" y="126" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="325" y="144" text-anchor="middle" dominant-baseline="central" fill="#444441">Frequency &amp; one-source match</text>
<text class="ts" x="325" y="164" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Group the 5 duplicate pairs</text>

<line x1="325" y1="182" x2="325" y2="212" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="195" y="212" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="325" y="230" text-anchor="middle" dominant-baseline="central" fill="#444441">Survive</text>
<text class="ts" x="325" y="250" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Pick the best record per group</text>

<line x1="325" y1="268" x2="325" y2="298" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="195" y="298" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="325" y="316" text-anchor="middle" dominant-baseline="central" fill="#444441">Master merge</text>
<text class="ts" x="325" y="336" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">10-row deduplicated CRM</text>

<rect x="475" y="212" width="160" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="555" y="230" text-anchor="middle" dominant-baseline="central" fill="#712B13">Standardize ERP</text>
<text class="ts" x="555" y="250" text-anchor="middle" dominant-baseline="central" fill="#993C1D">8 rows, same rules</text>

<path d="M325 354 L325 384" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M555 268 L555 374 L430 374 L430 384" fill="none" stroke="#993C1D" stroke-width="0.5" marker-end="url(#arrow-coral)"/>

<rect x="195" y="384" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="325" y="402" text-anchor="middle" dominant-baseline="central" fill="#444441">Match frequency (CRM + ERP)</text>
<text class="ts" x="325" y="422" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Stats for the final match</text>

<line x1="325" y1="440" x2="325" y2="470" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="195" y="470" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="325" y="488" text-anchor="middle" dominant-baseline="central" fill="#444441">Two-source match</text>
<text class="ts" x="325" y="508" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">Compare CRM vs ERP</text>

<line x1="325" y1="526" x2="325" y2="556" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="195" y="556" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="325" y="574" text-anchor="middle" dominant-baseline="central" fill="#085041">Final result</text>
<text class="ts" x="325" y="594" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">6 matched &#183; 6 exclusive records</text>
</svg>
